# Pre-registration of the preprocessing study. Written BEFORE any validation score of a
# new pipeline was computed. Change it only together with a note in REPORT.md.
data:
  raw_dir: data/raw

# Test batches are deliberately absent: this task never reads batches 8-10.
split:
  train_batches: [1, 2, 3, 4, 5, 6]
  val_batches: [7]
  inner_folds: [[1], [2], [3], [4, 5], [6]]   # leave-batch-group-out, used for hyper-parameters fitted on Train

seed: 0

# Data cleaning. Statistical outliers (IQR) are real drift and are kept. Only physically invalid
# records are removed, by a fixed rule fitted on Train: a cell is invalid if |x - median| / MAD > 1000
# (see src/cleaning.py). Flagged Train records are dropped; evaluation rows are never dropped.
cleaning:
  invalid_value_rule: {threshold: 1000}

# Fault scale. Bias = x + sign * delta * sigma. sigma_robust = IQR / 1.349 per feature, from the cleaned Train rows,
# so that outliers cannot inflate it. The OLD study used the plain std of Train, which two corrupt records had
# inflated (x316 for S06 |DR|, x48 S08, x25 S07, x3.7 S05, x3 S04 EMAi0.1): its G1 results are superseded.
faults:
  bias_scale: robust_iqr

# Fault-augmented models (SVM+Aug, LGBM+Aug) are trained with 5 augmentation seeds and reported as mean +- std,
# because dropping a single Train row moved one of them by 0.02.
augmentation:
  seeds: [0, 1, 2, 3, 4]
  copies: 1

# Fixed model settings during pipeline comparison, so that only the preprocessing changes.
# They are the settings the old baselines selected on Validation (results/main/02_baselines).
models:
  svm: {C: 10, gamma: scale}
  lgbm: {num_leaves: 15, n_estimators: 400, learning_rate: 0.05, class_weight: null}
  final_svm_grid: {C: [1, 10, 100], gamma: [scale, 0.01]}   # same grids as the old baselines, used for the tuned numbers
  final_lgbm_grid: {num_leaves: [15, 31], class_weight: [null, balanced]}

# A candidate replaces the incumbent only if it beats it by more than min_gain on the
# primary metric; otherwise the simpler one stays. LightGBM is reported next to SVM and
# any drop larger than lgbm_flag_drop is flagged in the report.
decision_rule:
  primary: svm_macro_f1
  min_gain: 0.005
  lgbm_flag_drop: 0.01

# Pipeline order: raw 128 -> clip -> build features (optional slog on raw block + engineered) -> scale -> select -> NaN fill.
baseline_spec: {clip: none, slog: false, scaler: standard, groups: [], select: none}

phase1:
  methods: [mean, median, knn, ridge, iterative]
  spaces: [raw, slog]            # space in which the imputer is fitted; errors are always reported in raw standardised units
  knn_neighbors: 5
  ridge_alphas: [0.001, 0.01, 0.1, 1, 10, 100, 1000]
  iterative: {max_iter: 5, mask_fraction: 0.5}

phase2:
  iqr_k: 1.5                     # Tukey inner fences
  drop_row_share: 0.10           # option (c): drop Train rows with >10% of features outside the fences
  bias_deltas: [1.0, 3.0]        # quick Bias scenario to test whether clipping hides the fault
  bias_seeds: [0, 1, 2]
  options: [keep_all, winsorize, drop_train_rows]

phase3:
  scalers: [standard, robust, minmax]
  slog: [false, true]

# Stress check of the Phase-3 winner (MinMax), registered before it was run.
# (1) per feature: ratio of the 1-99 percentile range to the min-max range on Train; ratios < ratio_flag mean the
#     scaler squeezes that feature because of a few extreme values.
# (2) MinMax with percentile bounds (fit on the 1st/99th percentile, clipped to [0,1] at transform only).
# (3) paired bootstrap over Validation rows, 1000 resamples, 95% interval of the Macro-F1 difference.
# Rule: adopt MinMax only if (A) the interval of MinMax - Standard excludes 0 AND (B) the percentile-bounded
# MinMax still beats Standard by more than decision_rule.min_gain (the gain does not come from squeezing).
# Otherwise adopt StandardScaler. If adopted, the percentile-bounded variant replaces full MinMax only when it beats
# it by more than min_gain.
phase3_stress:
  percentiles: [1, 99]
  ratio_flag: 0.05
  bootstrap: {n: 1000, seed: 0, ci: 0.95}

# Phase 4, shortened (time): at most two engineered groups, each sensor-local with a physical rationale, a reference
# and source-sensor tracking. Gate P4 rejects any group with a column that depends on more than one sensor (a fault in
# one sensor would then spread to the features of every sensor). pn_l2 and pn_logmed are logged for information only.
phase4:
  candidates:                    # each is tried on top of the incumbent pipeline
    - [trans_ratio]
    - [ema_shape]
    - [trans_ratio, ema_shape]
  rejected_by_p4_logged_only:
    - [pn_l2]
    - [pn_logmed]

# Phase 5, shortened: feature drift sensitivity computed on Train batches 1-6 only: eta2 = share of the variance of a
# feature (after removing the gas effect) explained by the batch. The three pre-registered options exclude none, the
# top 10% or the top 20% most drift-sensitive features. No sensor is ever removed completely.
phase5:
  min_own_features_per_sensor: 2
  candidates:
    - {name: none}
    - {name: drop_top10, drop_frac: 0.10}
    - {name: drop_top20, drop_frac: 0.20}

final:
  max_candidates: 12
  # Gate P3 reference: the SVM Macro-F1 of the best Phase-3 pipeline on CLEANED data (the old 0.878 was
  # inflated by two corrupt Train records, see results/main_cleaned/diagnosis). Gate: final >= reference - 0.01.
  p3_margin: 0.01
