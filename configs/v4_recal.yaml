# v4: carrying a calibration forward in time (POST-HOC, EXPLORATORY; results/decisions_log.md Q9 and R).
# Test data definition = configs/final_test_v2.yaml / configs/v3_prevbatch.yaml (Train 1-7 cleaned; batches 8, 9, 10).
base: configs/preprocessing.yaml
split:
  type: final_test
  train_batches: [1, 2, 3, 4, 5, 6, 7]
  test_batches: [8, 9, 10]
  approved_by_user: true          # user decision 2026-10-10 (v4 request): Part 1 arm (e), and the single R4 run only if R3 says GO
  inner_folds: [[1], [2], [3], [4, 5], [6], [7]]
# READ-ONLY inputs that exist only in the main checkout (git-ignored there): v2 fitted models, v3 per-scenario predictions.
main_checkout: C:/Users/Admin/icsic2026-gasdrift
v2_models: results/final_test_v2/test          # relative to main_checkout
v3_preds: results/v3_prevbatch/preds           # relative to main_checkout
# Development protocol (decisions_log R1): Drift-Dev Train = batches 1-3; batch 5 is read only for its calibration rows.
dev_config: configs/v2_drift_dev.yaml
dev_extra_batches: [5]
seeds: [0, 1, 2, 3, 4]
n_per_gas: 10
dev_targets: [6, 7]
test_targets: [9, 10]
memory: {6: [5], 7: [5, 6], 9: [8], 10: [8, 9]}   # calibration periods before t that are not in Train (R2)
# Candidates (R2), in the tie-break order of R3 (simpler first: W, then C, then S; smaller parameter first).
candidates:
  W1: {family: W, w: 1}
  W5: {family: W, w: 5}
  W20: {family: W, w: 20}
  C1: {family: C, r: 1}
  C2: {family: C, r: 2}
  S30: {family: S, q: 0.3}
  S60: {family: S, q: 0.6}
output_root: results/v4_recal
